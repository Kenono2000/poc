name: ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment for NVIDIA GPU acceleration:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull-model
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Ollama to become ready..."
        until ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling qwen2.5 model..."
        ollama pull qwen2.5
        echo "Model pull complete."

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      DEFAULT_MODELS: qwen2.5
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama

volumes:
  ollama-data:
  open-webui-data:
