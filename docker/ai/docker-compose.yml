name: ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # Keep model loaded in VRAM indefinitely (no reload penalty)
      OLLAMA_KEEP_ALIVE: "-1"
      # Force all layers onto GPU (remove CPU/GPU split)
      OLLAMA_NUM_GPU: "999"
      # Optional: limit to a single model in memory to save VRAM
      # OLLAMA_MAX_LOADED_MODELS: "1"
      # Optional: allow parallel requests (increase if you have spare VRAM)
      # OLLAMA_NUM_PARALLEL: "1"
    # Uncomment for NVIDIA GPU acceleration:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull-model
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Ollama to become ready..."
        until ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling qwen2.5 model..."
        ollama pull qwen2.5
        echo "Model pull complete."

volumes:
  ollama-data: